{% set tbb_version = "2023.2.0" %}
# this variable defines oneMKL specific version
{% set mkl_version = "2026.2.0" %}
# this variable defines oneMKL specific buildnum
{% set mkl_buildnum = "" %}
{% set mkl_buildnum = "881" %}  # [linux]
{% set mkl_buildnum = "882" %}  # [win]
# this variable defines oneDAL specific version
{% set dal_version = "2026.2.0" %}
# this variable defines oneDAL specific buildnum
{% set dal_buildnum = "" %}
{% set dal_buildnum = "299" %}  # [linux]
{% set dal_buildnum = "300" %}  # [win]
# this variable defines openmp specific version
{% set openmp_version = "2026.2.0" %}
# this variable defines openmp specific buildnum
{% set openmp_buildnum = "" %}
{% set openmp_buildnum = "863" %}  # [linux]
{% set openmp_buildnum = "864" %}  # [win]

# this variable defines impi specific version
{% set impi_version = "2021.19.0" %}
# this variable defines impi specific buildnum
{% set impi_buildnum = "0" %}
{% set impi_buildnum = "561" %}  # [linux]
{% set impi_buildnum = "562" %}  # [win]

# this variable defines onedpl specific version
{% set onedpl_version = "2022.14.0" %}
# this variable defines onedpl specific buildnum
{% set onedpl_buildnum = "154" %}  # [linux]
{% set onedpl_buildnum = "155" %}  # [win]


{% set my_channel_targets = channel_targets if channel_targets is defined else ['conda-forge', 'defaults'] %}

{% set intel_ch = "https://software.repos.intel.com/python/conda" %}
# use this if our build script changes and we need to increment beyond intel's version
{% set dstbuildnum = '0' %}


# More info about OpenMP mutex could be found on conda-forge wiki:
# https://conda-forge.org/docs/maintainer/knowledge_base/#openmp
{% set openmp_pkg = "llvm-openmp" %}
{% set openmp_mutex = "- _openmp_mutex * *_llvm" %}
{% if win or 'conda-forge' not in my_channel_targets %}
{% set openmp_mutex = "" %}
{% endif %}

package:
  name: intel_repack
  # Use oneDAL as overall repack package version
  version: {{ dal_version }}

source:
  - url: {{ intel_ch }}/{{ target_platform }}/mkl-{{ mkl_version }}-intel_{{ mkl_buildnum }}.conda
    folder: mkl
    no_hoist: true
  - url: {{ intel_ch }}/{{ target_platform }}/mkl-devel-{{ mkl_version }}-intel_{{ mkl_buildnum }}.conda
    folder: mkl-devel
    no_hoist: true
  - url: {{ intel_ch }}/{{ target_platform }}/mkl-include-{{ mkl_version }}-intel_{{ mkl_buildnum }}.conda
    folder: mkl-include
    no_hoist: true
  - url: {{ intel_ch }}/{{ target_platform }}/mkl-static-{{ mkl_version }}-intel_{{ mkl_buildnum }}.conda
    folder: mkl-static
    no_hoist: true
  - url: {{ intel_ch }}/{{ target_platform }}/onemkl-sycl-blas-{{ mkl_version }}-intel_{{ mkl_buildnum }}.conda
    folder: onemkl-sycl-blas
    no_hoist: true
  - url: {{ intel_ch }}/{{ target_platform }}/onemkl-sycl-datafitting-{{ mkl_version }}-intel_{{ mkl_buildnum }}.conda
    folder: onemkl-sycl-datafitting
    no_hoist: true
  - url: {{ intel_ch }}/{{ target_platform }}/onemkl-sycl-dft-{{ mkl_version }}-intel_{{ mkl_buildnum }}.conda
    folder: onemkl-sycl-dft
    no_hoist: true
  - url: {{ intel_ch }}/{{ target_platform }}/onemkl-sycl-lapack-{{ mkl_version }}-intel_{{ mkl_buildnum }}.conda
    folder: onemkl-sycl-lapack
    no_hoist: true
  - url: {{ intel_ch }}/{{ target_platform }}/onemkl-sycl-rng-{{ mkl_version }}-intel_{{ mkl_buildnum }}.conda
