         - mkl-devel/info/licenses/tpp.txt
    test:
      requires:
        # cmake also needs a compiler to run package detection, see
        # https://discourse.cmake.org/t/questions-about-find-package-cli-msvc/6194
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - cmake
        - ninja
        - pkg-config
        - mkl-static {{ mkl_version }}  # [linux]
        - tbb-devel  # [linux]
      files:
        - cmake_test/
        - tests/src/mkl_dgemm.c
      commands:
        - ls -A $PREFIX/lib/*  # [linux]
        - ls -A $PREFIX/include/*  # [linux]
        - ls -A $PREFIX/lib/pkgconfig/*  # [linux]
        - test -f $PREFIX/lib/pkgconfig/mkl-sdl.pc  # [linux]
        - if not exist %LIBRARY_LIB%\\pkgconfig\\mkl-sdl.pc exit 1  # [win]

        # test integrity of CMake metadata
        - cd cmake_test
        - cmake -GNinja $CMAKE_ARGS .   # [unix]
        - cmake -GNinja %CMAKE_ARGS% .  # [win]
        # build and run through every threading layer and link type
        - for t in sequential gnu_thread tbb_thread intel_thread; do for l in dynamic static; do cmake -S . -B build_$t$l -GNinja $CMAKE_ARGS -DMKL_THREADING=$t -DMKL_LINK=$l && cmake --build build_$t$l && ./build_$t$l/mkl_dgemm || exit 1; done; done  # [linux]

