build:
  number: {{ dal_buildnum|int + dstbuildnum|int }}
  binary_relocation: false
  detect_binary_files_with_prefix: false
  skip: True                                  # [not (linux64 or win)]

outputs:
  - name: mkl
    version: {{ mkl_version }}
    script: repack.sh   # [linux]
    script: repack.bat  # [win]
    number: {{ mkl_buildnum|int + mkl_dstbuildnum|int }}
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - {{ stdlib('c') }}
        - {{ openmp_pkg }}
        {% if use_openmp_mutex %}
        - _openmp_mutex * *_llvm
        {% endif %}
      host:
        - tbb-devel {{ tbb_version.split('.')[0] }}.*
    about:
      home: https://www.intel.com/content/www/us/en/developer/tools/oneapi/onemkl.html
      license: LicenseRef-IntelSimplifiedSoftwareOct2022
      license_family: Proprietary
      license_file:
         - mkl/info/licenses/license.txt
         - mkl/info/licenses/tpp.txt
      summary: Intel® oneAPI Math Kernel Library runtime libraries
      description: |
        Intel® oneAPI Math Kernel Library is Intel®-Optimized Math Library for Numerical Computing on CPUs & GPUs.<br/>
        This package is a repackaged set of binaries obtained directly from Intel's conda channel.<br/>
        Using oneMKL in the Python Ecosystem: https://www.intel.com/content/www/us/en/developer/articles/technical/using-onemkl-in-the-python-ecosystem.html <br/>
        Integrating oneMKL with R: https://www.intel.com/content/www/us/en/developer/articles/technical/using-onemkl-with-r.html
      doc_url: https://www.intel.com/content/www/us/en/developer/tools/oneapi/onemkl.html
    test:
      requires:
        - python *
        {% if run_ecosystem_test %}
        # consumers as users get them: gfortran-built, reaching MKL through
        # libblas
        - libblas * *mkl
        - numpy *
        - scipy
        - threadpoolctl
        {% endif %}
      files:
        - tests/load_libs.py
        - tests/mkl_layers.py
        - tests/mkl_ecosystem.py
      commands:
        - ls -A $PREFIX/lib/*  # [linux]
        - test -f $PREFIX/lib/libmkl_core.so.3  # [linux]
        - if not exist %LIBRARY_BIN%\\mkl_core.3.dll exit 1  # [win]
        # MPI-only libraries, and CPU kernels that would fault on older CPUs
        - python tests/load_libs.py blacs scalapack cdft avx mc3
        - python tests/mkl_layers.py
        {% if run_ecosystem_test %}
        - python tests/mkl_ecosystem.py
        {% endif %}

  - name: mkl-include
    version: {{ mkl_version }}
    script: repack.sh   # [linux]
    script: repack.bat  # [win]
    number: {{ mkl_buildnum|int + mkl_dstbuildnum|int }}
    about:
      home: https://www.intel.com/content/www/us/en/developer/tools/oneapi/onemkl.html
      license: LicenseRef-IntelSimplifiedSoftwareOct2022
      license_family: Proprietary
      license_file:
         - mkl-include/info/licenses/license.txt
         - mkl-include/info/licenses/tpp.txt
      summary: Headers for building against Intel® oneMKL libraries
      description: |
        Intel® oneAPI Math Kernel Library headers for developing software that uses oneMKL.<br/>
        This package is a repackaged set of binaries obtained directly from Intel's conda channel.<br/>
        Using oneMKL in the Python Ecosystem: https://www.intel.com/content/www/us/en/developer/articles/technical/using-onemkl-in-the-python-ecosystem.html <br/>
        Integrating oneMKL with R: https://www.intel.com/content/www/us/en/developer/articles/technical/using-onemkl-with-r.html
      doc_url: https://www.intel.com/content/www/us/en/developer/tools/oneapi/onemkl.html
    test:
      requires:
        - {{ compiler('c') }}  # [linux]
      commands:
        - ls -A $PREFIX/include/*  # [linux]
        - test -f $PREFIX/include/mkl.h  # [linux]
        - $CC -fsyntax-only -x c -include mkl.h -I$PREFIX/include /dev/null  # [linux]
        - if not exist %LIBRARY_INC%\\mkl.h exit 1  # [win]

  - name: onemkl-sycl-blas
    version: {{ mkl_version }}
    script: repack.sh   # [linux]
    script: repack.bat  # [win]
    build:
      ignore_run_exports_from:
        {% if use_openmp_mutex %}
        - _openmp_mutex * *_llvm
        {% endif %}
    number: {{ mkl_buildnum|int + mkl_dstbuildnum|int }}
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ c_stdlib }}_{{ target_platform }} {{ c_stdlib_sycl_version }}  # [linux]
        - {{ stdlib('c') }}  # [not linux]
        {% if use_openmp_mutex %}
        - _openmp_mutex * *_llvm
        {% endif %}
      host:
        - intel-sycl-rt {{ mkl_version.split('.')[0] }}.*
        # cpu runtime
        - intel-opencl-rt {{ mkl_version.split('.')[0] }}.*
        {% if use_openmp_mutex %}
        - _openmp_mutex * *_llvm
        {% endif %}
        - ocl-icd  # [linux]
        - khronos-opencl-icd-loader  # [win]
        # We need mkl because onemkl-sycl-* packages uses symbols from mkl, but
        # not linked directly so you can chose different implementations.
        # More information could be found at:
        # https://www.intel.com/content/www/us/en/docs/onemkl/developer-guide-linux/2025-0/layered-model-concept.html
        - {{ pin_subpackage('mkl', exact=True) }}
      run:
        # We need mkl because onemkl-sycl-* packages uses symbols from mkl, but
        # not linked directly so you can chose different implementations.
        # More information could be found at:
        # https://www.intel.com/content/www/us/en/docs/onemkl/developer-guide-linux/2025-0/layered-model-concept.html
        - {{ pin_subpackage('mkl', exact=True) }}
    about:
      home: https://www.intel.com/content/www/us/en/developer/tools/oneapi/onemkl.html
      license: LicenseRef-IntelSimplifiedSoftwareOct2022
      license_family: Proprietary
      license_file:
         - onemkl-sycl-blas/info/licenses/license.txt
         - onemkl-sycl-blas/info/licenses/tpp.txt
      summary: Intel® oneAPI Math Kernel Library runtime libraries
      description: |
        Intel® oneAPI Math Kernel Library is Intel®-Optimized Math Library for Numerical Computing on CPUs & GPUs.<br/>
        This package is a repackaged set of binaries obtained directly from Intel's conda channel.<br/>
        Using oneMKL in the Python Ecosystem: https://www.intel.com/content/www/us/en/developer/articles/technical/using-onemkl-in-the-python-ecosystem.html <br/>
        Integrating oneMKL with R: https://www.intel.com/content/www/us/en/developer/articles/technical/using-onemkl-with-r.html
      doc_url: https://www.intel.com/content/www/us/en/developer/tools/oneapi/onemkl.html
    test:
      requires:
        - python *
      files:
        - tests/load_libs.py
      commands:
          - ls -A $PREFIX/lib/*  # [linux]
          - test -f $PREFIX/lib/libmkl_sycl_blas.so.6  # [linux]
          # takes its MKL symbols from the application's MKL link line
          - python tests/load_libs.py +libmkl_core.so.3 +libmkl_sequential.so.3 +libmkl_intel_ilp64.so.3  # [linux]
          - if not exist %LIBRARY_BIN%\\mkl_sycl_blas.6.dll exit 1  # [win]

  - name: onemkl-sycl-datafitting
    version: {{ mkl_version }}
    script: repack.sh   # [linux]
    script: repack.bat  # [win]
    build:
      ignore_run_exports_from:
        {% if use_openmp_mutex %}
        - _openmp_mutex * *_llvm
        {% endif %}
    number: {{ mkl_buildnum|int + mkl_dstbuildnum|int }}
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ c_stdlib }}_{{ target_platform }} {{ c_stdlib_sycl_version }}  # [linux]
        - {{ stdlib('c') }}  # [not linux]
        {% if use_openmp_mutex %}
        - _openmp_mutex * *_llvm
        {% endif %}
      host:
        - intel-sycl-rt {{ mkl_version.split('.')[0] }}.*
        # cpu runtime
        - intel-opencl-rt {{ mkl_version.split('.')[0] }}.*
        {% if use_openmp_mutex %}
        - _openmp_mutex * *_llvm
        {% endif %}
        - ocl-icd  # [linux]
        - khronos-opencl-icd-loader  # [win]
        # We need mkl because onemkl-sycl-* packages uses symbols from mkl, but
        # not linked directly so you can chose different implementations.
        # More information could be found at:
        # https://www.intel.com/content/www/us/en/docs/onemkl/developer-guide-linux/2025-0/layered-model-concept.html
        - {{ pin_subpackage('mkl', exact=True) }}
      run:
        # We need mkl because onemkl-sycl-* packages uses symbols from mkl, but
        # not linked directly so you can chose different implementations.
        # More information could be found at:
        # https://www.intel.com/content/www/us/en/docs/onemkl/developer-guide-linux/2025-0/layered-model-concept.html
        - {{ pin_subpackage('mkl', exact=True) }}
    about:
      home: https://www.intel.com/content/www/us/en/developer/tools/oneapi/onemkl.html
      license: LicenseRef-IntelSimplifiedSoftwareOct2022
      license_family: Proprietary
      license_file:
         - onemkl-sycl-datafitting/info/licenses/license.txt
         - onemkl-sycl-datafitting/info/licenses/tpp.txt
      summary: Intel® oneAPI Math Kernel Library runtime libraries
      description: |
