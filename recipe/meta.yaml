        - cp -rv $SRC_DIR/$PKG_NAME/* $PREFIX  # [linux]
        - rm -rf $PREFIX/info  # [linux]
        - set "src=%SRC_DIR%\%PKG_NAME%"  # [win]
        - COPY "%src%\info\LICENSE.txt" "%SRC_DIR%"  # [win]
        - robocopy /E "%src%" "%PREFIX%"  # [win]
        - if %ERRORLEVEL% GEQ 8 exit 1  # [win]
        - rd /s /q %PREFIX%\info  # [win]
      run_exports:
        - {{ pin_subpackage('mkl-dpcpp') }}
    requirements:
      run:
        - {{ pin_subpackage('mkl-devel', exact=True) }}
        - {{ pin_subpackage('mkl-dpcpp', exact=True) }}
