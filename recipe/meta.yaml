        # by MKL, otherwise BLAS/LAPACK symbol collisions can occur at runtime
        # (e.g. between MKL and OpenBLAS loaded into the same process).
        - libblas =*=*mkl
        - libcblas =*=*mkl
        - liblapack =*=*mkl
        - liblapacke =*=*mkl
